# ════════════════════════════════════════════════════════════════════════
# Actualizar datos y publicar la página
# ════════════════════════════════════════════════════════════════════════
# Corre solo:
#   - dos veces al día, hacia las 05:00 y 17:00 de Lima (GitHub suele retrasar
#     las corridas programadas a la hora en punto: por eso el minuto 17)
#   - al apretar "Run workflow" en la pestaña Actions de GitHub
#   - en cada push a main (para publicar cambios de diseño o de catálogo)
#
# Qué hace: corre el mismo pipeline que en la laptop, guarda en el repo los
# JSON que cambiaron y publica la carpeta sitio/ en GitHub Pages.
#
# Si una fuente falla: la página se publica igual con el último dato bueno
# (y lo dice), pero la corrida termina en rojo y GitHub manda un correo.
# ════════════════════════════════════════════════════════════════════════
name: Actualizar y publicar

on:
  schedule:
    - cron: "17 * * * *"      # cada hora; run.py decide qué fuente toca leer
  workflow_dispatch:
    inputs:
      historico:
        description: "Años de OISST a reprocesar (p. ej. 1981-2025). Vacío = corrida normal."
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write     # para guardar los datos nuevos en el repo
  pages: write        # para publicar
  id-token: write     # lo exige actions/deploy-pages

# Nunca dos corridas a la vez: la segunda espera a que termine la primera
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el pipeline
        id: pipeline
        continue-on-error: true      # se publica igual; el fallo se reporta al final
        env:
          # Claves de IA. Solo hace falta la del proveedor elegido en catalogo/ia.yaml
          # (Settings → Secrets and variables → Actions → New repository secret).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.historico }}" ]; then
            python pipeline/run.py --solo oisst --historico "${{ github.event.inputs.historico }}"
          fi
          python pipeline/run.py

      - name: Guardar datos nuevos en el repo
        id: guardar
        run: |
          git config user.name  "ensoperu-bot"
          git config user.email "ensoperu-bot@users.noreply.github.com"
          git add sitio/datos
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=si" >> "$GITHUB_OUTPUT"
            git commit -m "datos: actualización automática $(date -u +%Y-%m-%d)"
            # El robot local puede haber subido avisos en el intermedio
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 20
            done
          fi

      # Se publica si hay datos nuevos o si la corrida no es la programada (cambio de código, botón).
      # Publicar sin cambios gastaba despliegues y GitHub empezó a rechazarlos.
      - uses: actions/configure-pages@v5
        if: steps.guardar.outputs.cambios == 'si' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guardar.outputs.cambios == 'si' || github.event_name != 'schedule'
        with:
          path: sitio
      - id: publicar
        if: steps.guardar.outputs.cambios == 'si' || github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub a veces responde "Deployment failed, try again later": un segundo intento tras un minuto
      - name: Esperar antes de reintentar la publicación
        if: steps.publicar.outcome == 'failure'
        run: sleep 60
      - id: publicar2
        if: steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Reportar fallo de alguna fuente
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Al menos una fuente falló. La página quedó con el último dato bueno. Ver el resumen de la corrida."
          exit 1
