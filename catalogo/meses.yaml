# ════════════════════════════════════════════════════════════════════════
# MESES DEL SELECTOR · editable a mano
# ════════════════════════════════════════════════════════════════════════
# El selector siempre empieza con "Ahora" (condición observada) y sigue con
# los meses objetivo de pronóstico. El pipeline los genera solo a partir
# del mes actual, así nunca quedan meses viejos en la página.
#
#   horizonte   cuántos meses hacia adelante (el pronóstico estacional
#               llega a 6; más allá no tiene sentido)
#
# Los análisis por región se buscan en sitio/datos/analisis/<region>/<AAAA-MM>.json.
# ════════════════════════════════════════════════════════════════════════

horizonte: 6
