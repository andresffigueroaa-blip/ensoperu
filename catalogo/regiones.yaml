# ════════════════════════════════════════════════════════════════════════
# REGIONES · editable a mano
# ════════════════════════════════════════════════════════════════════════
# La clave (p. ej. "Madre De Dios") es el identificador: debe coincidir con
# el nombre del departamento en sitio/datos/geo/departamentos.json.
#
#   nombre   cómo se muestra en la página (con tildes)
#   zona     zona climática; elige qué plantillas de texto se usan
#   litoral  true si tiene mar (activa la capa de temperatura del mar)
#   demo     valores de DEMOSTRACIÓN por capa. Se usan solo para las capas
#            que todavía no tienen fuente real (ver capas.yaml). Cuando una
#            capa tenga fuente, el pipeline ignora este valor.
#
# Para agregar una región: copia un bloque, cambia la clave y los campos.
# ════════════════════════════════════════════════════════════════════════

