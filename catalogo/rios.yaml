# ════════════════════════════════════════════════════════════════════════
# RÍOS VIGILADOS · editable a mano
# ════════════════════════════════════════════════════════════════════════
# Puntos donde se consulta el caudal pronosticado (GloFAS, vía Open-Meteo).
# Las coordenadas son aproximadas: pipeline/herramientas/build_rios.py busca
# en las celdas vecinas la de mayor caudal, para caer sobre el cauce principal.
# Si agregas un río, corre esa herramienta.
#
# Es un modelo global de 5 km: en cuencas pequeñas y reguladas por presas
# puede errar. Sirve para ver cuándo se espera una crecida inusual, no para
# medir. Los caudales oficiales son del SENAMHI y de la ANA.
# ════════════════════════════════════════════════════════════════════════

