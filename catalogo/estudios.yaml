- id: lavado-espinoza-2014
  titulo: "Impactos de El Niño y La Niña en las lluvias del Perú (1965-2007)"
  autores: "Lavado-Casimiro, W. y Espinoza, J. C."
  anio: 2014
  fuente: "Revista Brasileira de Meteorologia, 29(2), 171-182"
  url: "https://doi.org/10.1590/S0102-77862014000200003"
  temas: [lluvias, sequia, inundaciones]
  lugares: [Peru]
  hallazgo: "Con 155 estaciones, los eventos fuertes traen más lluvia a la vertiente del Pacífico norte y déficit en la cuenca del Titicaca y en el sur andino; la vertiente amazónica responde más a La Niña fuerte."

